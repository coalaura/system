load_module /etc/nginx/modules/ngx_http_nwall_module.so;

user www-data;

worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

pcre_jit on;
quic_bpf on;

pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 32768;
	multi_accept on;
	use epoll;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	aio threads;
	server_tokens off;
	types_hash_max_size 4096;
	server_names_hash_bucket_size 128;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Replace "Server" and "X-Powered-By" Headers
	##

	more_set_headers "Server: meowd";
	more_set_headers "X-Powered-By: cardboard/1.0";

	##
	# Timeouts
	##

	client_body_timeout 10s;
	client_header_timeout 10s;
	keepalive_timeout 60s;
	keepalive_requests 1000;
	keepalive_time 1h;
	send_timeout 20s;
  	reset_timedout_connection on;

	##
	# Buffer & Size limits
	##

	client_body_buffer_size 128k;
	client_header_buffer_size 1k;
	client_max_body_size 20m;
	large_client_header_buffers 4 8k;
	ignore_invalid_headers on;
	output_buffers 2 1m;
	max_headers 45;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.3 TLSv1.2;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;
	ssl_certificate_compression on;
	ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
	ssl_conf_command Options KTLS;
	ssl_conf_command Options PrioritizeChaCha;
	ssl_conf_command Options +ServerPreference;
	ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768:X25519:prime256v1;

	# TLSv1.2 support
	ssl_prefer_server_ciphers off;
	ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

	##
	# QUIC / HTTP/3
	##

	ssl_early_data off;
	quic_retry on;
	quic_gso on;

	more_set_headers "Alt-Svc: h3=\":443\"; ma=86400; persist";

	##
	# DNS Resolvers
	##

	# unbound listening on 5353
	resolver 127.0.0.1:5353 valid=300s ipv6=off;
	resolver_timeout 2s;

	##
	# Security Headers
	##

	map $host $frame_ancestors {
		default    "";

		example.com    "*";
	}

	map $frame_ancestors $x_frame_options {
		default    "";

		""    "SAMEORIGIN";
	}

	more_set_headers "X-Frame-Options: $x_frame_options";
	more_set_headers "X-Content-Type-Options: nosniff";
	more_set_headers "X-XSS-Protection: 0";

	more_set_headers "Referrer-Policy: strict-origin";
	more_set_headers "Permissions-Policy: accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
	more_set_headers "Cross-Origin-Opener-Policy: same-origin";
	more_set_headers "Cross-Origin-Resource-Policy: cross-origin";
	more_set_headers "Cross-Origin-Embedder-Policy: credentialless; report-to=\"security\"";

	more_set_headers "Reporting-Endpoints: security=\"https://sec.shrt.day/meow\"";
	more_set_headers "Content-Security-Policy: default-src 'self'; frame-ancestors 'self' $frame_ancestors; img-src https: data: blob:; media-src https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://scout.shrt.day https://data.shrt.day https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://scout.shrt.day https://err.shrt.day; object-src 'none'; base-uri 'self'; form-action 'self'; report-to security; report-uri https://sec.shrt.day/meow;";

	# we do not do http around here
	more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";

	##
	# Content Headers
	##

	charset utf-8;
	charset_types
		application/xhtml+xml
		text/plain
		text/css
		text/xml
		application/xml
		application/rss+xml
		application/javascript
		application/json
		image/svg+xml;

	##
	# Cache Settings
	##

	open_file_cache max=100000 inactive=20s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	##
	# Logging Settings
	##

	log_format pq '$remote_addr [$time_local] "$host" '
				'"$request" $status $body_bytes_sent ${request_time}s '
				'"$http_referer" "$http_user_agent" '
				'$ssl_curve';

	access_log /var/log/nginx/access.log pq;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_static on;
	gzip_types
		text/plain text/css text/xml application/xml application/xhtml+xml
		application/rss+xml application/javascript application/json
		image/svg+xml application/x-font-ttf font/ttf font/otf
		application/vnd.ms-fontobject font/woff font/woff2;

	##
	# Brotli Settings
	##

	brotli on;
	brotli_comp_level 4;
	brotli_types text/plain text/css application/javascript application/json image/svg+xml;
	brotli_min_length 256;
	brotli_static on;

	##
	# Proxy Mappings
	##

	map $http_upgrade $connection_upgrade {
		default upgrade;
		""      close;
	}

	map $remote_addr $proxy_add_forwarded {
		# v4 is sent as-is
		~^[0-9.]+$        "for=$remote_addr";

		# v6 has to be bracketed and quoted
		~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";

		default           "for=unknown";
	}

	##
	# Proxy Defaults
	##

	proxy_http_version 1.1;
	proxy_cache_bypass $http_upgrade;

	proxy_connect_timeout 5s;
	proxy_send_timeout 30s;
	proxy_read_timeout 30s;

	proxy_ssl_server_name on;

	proxy_set_header Host $host;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;

	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header Forwarded $proxy_add_forwarded;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Port $server_port;

	##
	# Custom blocker module
	##

	nwall on;
	nwall_log basic;
	nwall_rules /etc/nginx/nwall.rules;

	##
	# Default Catch-All Host Configs
	##

	#! letsencrypt uses certbots nginx plugin, no special :80 handling needed

	server {
		listen 80 default_server;
		listen [::]:80 default_server;

		server_name _;

		access_log off;

		return 444;
	}

	server {
		listen 443 ssl default_server;
		listen [::]:443 ssl default_server;

		listen 443 quic reuseport default_server;
		listen [::]:443 quic reuseport default_server;

		server_name _;

		ssl_reject_handshake on;

		access_log off;

		return 444;
	}

	##
	# Virtual Host Configs
	##

	#! we don't have any AAAA records (ip6.shrt.day is the exception),
	#! which is why we don't listen on [::]:443. long live ipv4

	# example.com

	server {
		listen 443 ssl;
		listen 443 quic;

		server_name example.com;
		http2 on;

		root /var/example.com/public;

		location / {
			index index.html index.htm;
		}

		location /proxy {
			proxy_pass http://127.0.0.1:1234;
		}

		ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	}
}

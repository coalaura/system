# Local virtual-mail configuration.
#
# This file assumes:
# - Virtual users authenticate only through /etc/dovecot/users.
# - Mail is stored in Maildir format under /var/mail/vhosts.
# - Postfix delivers virtual mail through the LMTP socket below.
# - IMAPS on TCP/993 is enabled; plaintext IMAP/143 and POP3 are disabled.

##
## TLS and authentication
##

# Require TLS before authentication and for all client connections.
ssl = required
disable_plaintext_auth = yes
ssl_min_protocol = TLSv1.2

ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem

# Canonicalize all addresses before passwd-file lookup.
# /etc/dovecot/users must contain complete lowercase addresses, for example:
# noreply@example.com:{ARGON2ID}...
auth_username_format = %Lu

# AUTH PLAIN is safe because TLS is mandatory.
# Add "login" only if a required client cannot use PLAIN:
# auth_mechanisms = plain login
auth_mechanisms = plain

# Only /etc/dovecot/users is a password database.
passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

# The static userdb uses one unprivileged Unix account for all virtual mail.
#
# Do not set allow_all_users=yes: without it, the static userdb verifies that
# the account exists in the passdb. This ensures only users in
# /etc/dovecot/users are valid.
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

##
## Mail storage
##

# /var/mail/vhosts/<domain>/<localpart>/Maildir
mail_location = maildir:~/Maildir

# This is only needed for traditional /var/mail mbox delivery.
# Virtual Maildir delivery does not need it.
mail_privileged_group =

##
## Services and Postfix integration
##

# Do not expose plaintext IMAP or POP3.
service imap-login {
  inet_listener imap {
    port = 0
  }

  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }

  inet_listener pop3s {
    port = 0
  }
}

# Dovecot's SMTP AUTH socket for Postfix.
# Postfix accesses this as "private/auth" from inside /var/spool/postfix.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# Postfix delivers virtual mail to this LMTP socket as:
# lmtp:unix:private/dovecot-lmtp
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}